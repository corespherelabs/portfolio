<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="100%" stop-color="#0D111B"/>
    </linearGradient>
    <linearGradient id="indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sphere-grad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#312E81"/>
    </radialGradient>
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="circle-clip">
      <circle cx="200" cy="200" r="195"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bg)" rx="16"/>

  <!-- Dot grid pattern - top-left quadrant -->
  <g opacity="0.18" fill="#6366F1">
    <circle cx="20" cy="20" r="1.5"/><circle cx="40" cy="20" r="1.5"/><circle cx="60" cy="20" r="1.5"/><circle cx="80" cy="20" r="1.5"/>
    <circle cx="20" cy="40" r="1.5"/><circle cx="40" cy="40" r="1.5"/><circle cx="60" cy="40" r="1.5"/><circle cx="80" cy="40" r="1.5"/>
    <circle cx="20" cy="60" r="1.5"/><circle cx="40" cy="60" r="1.5"/><circle cx="60" cy="60" r="1.5"/><circle cx="80" cy="60" r="1.5"/>
    <circle cx="20" cy="80" r="1.5"/><circle cx="40" cy="80" r="1.5"/><circle cx="60" cy="80" r="1.5"/><circle cx="80" cy="80" r="1.5"/>
  </g>

  <!-- Dot grid pattern - bottom-right quadrant -->
  <g opacity="0.18" fill="#38BDF8">
    <circle cx="320" cy="320" r="1.5"/><circle cx="340" cy="320" r="1.5"/><circle cx="360" cy="320" r="1.5"/><circle cx="380" cy="320" r="1.5"/>
    <circle cx="320" cy="340" r="1.5"/><circle cx="340" cy="340" r="1.5"/><circle cx="360" cy="340" r="1.5"/><circle cx="380" cy="340" r="1.5"/>
    <circle cx="320" cy="360" r="1.5"/><circle cx="340" cy="360" r="1.5"/><circle cx="360" cy="360" r="1.5"/><circle cx="380" cy="360" r="1.5"/>
    <circle cx="320" cy="380" r="1.5"/><circle cx="340" cy="380" r="1.5"/><circle cx="360" cy="380" r="1.5"/><circle cx="380" cy="380" r="1.5"/>
  </g>

  <!-- Dot grid pattern - top-right -->
  <g opacity="0.1" fill="#818CF8">
    <circle cx="320" cy="20" r="1.5"/><circle cx="340" cy="20" r="1.5"/><circle cx="360" cy="20" r="1.5"/><circle cx="380" cy="20" r="1.5"/>
    <circle cx="320" cy="40" r="1.5"/><circle cx="340" cy="40" r="1.5"/><circle cx="360" cy="40" r="1.5"/><circle cx="380" cy="40" r="1.5"/>
    <circle cx="320" cy="60" r="1.5"/><circle cx="340" cy="60" r="1.5"/><circle cx="360" cy="60" r="1.5"/><circle cx="380" cy="60" r="1.5"/>
  </g>

  <!-- Angular circuit-like lines (tech pattern) -->
  <g stroke="#6366F1" stroke-width="0.5" opacity="0.2">
    <!-- Top-left corner circuit -->
    <line x1="20" y1="110" x2="80" y2="110"/>
    <line x1="80" y1="110" x2="110" y2="80"/>
    <line x1="110" y1="80" x2="110" y2="20"/>
    <circle cx="80" cy="110" r="2.5" fill="#6366F1" opacity="0.5"/>
    <circle cx="110" cy="80" r="2.5" fill="#6366F1" opacity="0.5"/>
    <!-- Bottom-right corner circuit -->
    <line x1="380" y1="290" x2="320" y2="290"/>
    <line x1="320" y1="290" x2="290" y2="320"/>
    <line x1="290" y1="320" x2="290" y2="380"/>
    <circle cx="320" cy="290" r="2.5" fill="#38BDF8" opacity="0.5"/>
    <circle cx="290" cy="320" r="2.5" fill="#38BDF8" opacity="0.5"/>
    <!-- Top-right diagonal -->
    <line x1="380" y1="130" x2="310" y2="130"/>
    <line x1="310" y1="130" x2="280" y2="100"/>
    <circle cx="310" cy="130" r="2" fill="#818CF8" opacity="0.4"/>
    <!-- Bottom-left diagonal -->
    <line x1="20" y1="270" x2="90" y2="270"/>
    <line x1="90" y1="270" x2="120" y2="300"/>
    <circle cx="90" cy="270" r="2" fill="#818CF8" opacity="0.4"/>
  </g>

  <!-- Ambient glow behind orbital rings -->
  <circle cx="200" cy="200" r="140" fill="url(#center-glow)" opacity="0.4"/>

  <!-- Orbital rings - concentric -->
  <circle cx="200" cy="200" r="160" stroke="#6366F1" stroke-width="0.75" stroke-dasharray="4 8" opacity="0.25"/>
  <circle cx="200" cy="200" r="135" stroke="#38BDF8" stroke-width="0.75" stroke-dasharray="3 6" opacity="0.2"/>
  <circle cx="200" cy="200" r="110" stroke="#818CF8" stroke-width="1" stroke-dasharray="6 10" opacity="0.3"/>
  <circle cx="200" cy="200" r="85"  stroke="#6366F1" stroke-width="1.5" opacity="0.35"/>
  <circle cx="200" cy="200" r="62"  stroke="#38BDF8" stroke-width="1" opacity="0.3"/>
  <circle cx="200" cy="200" r="40"  stroke="rgba(99,102,241,0.6)" stroke-width="1.5" opacity="0.5"/>

  <!-- Orbital accent dots -->
  <circle cx="360" cy="200" r="4" fill="#38BDF8" opacity="0.7" filter="url(#soft-glow)"/>
  <circle cx="40"  cy="200" r="3" fill="#6366F1" opacity="0.6"/>
  <circle cx="200" cy="65"  r="3.5" fill="#818CF8" opacity="0.7"/>
  <circle cx="200" cy="335" r="3" fill="#38BDF8" opacity="0.5"/>
  <circle cx="285" cy="115" r="3" fill="#6366F1" opacity="0.6"/>
  <circle cx="115" cy="285" r="3" fill="#38BDF8" opacity="0.6"/>
  <circle cx="285" cy="285" r="2.5" fill="#818CF8" opacity="0.5"/>
  <circle cx="115" cy="115" r="2.5" fill="#6366F1" opacity="0.5"/>

  <!-- Inner glow halo -->
  <circle cx="200" cy="200" r="30" fill="#6366F1" opacity="0.15" filter="url(#blur-glow)"/>

  <!-- Central sphere -->
  <circle cx="200" cy="200" r="22" fill="url(#sphere-grad)" filter="url(#soft-glow)"/>
  <!-- Sphere highlight -->
  <circle cx="193" cy="193" r="8" fill="rgba(255,255,255,0.15)"/>
  <!-- Sphere core dot -->
  <circle cx="200" cy="200" r="5" fill="#38BDF8" opacity="0.9"/>
  <circle cx="200" cy="200" r="2.5" fill="white" opacity="0.95"/>

  <!-- Subtle horizontal line through center -->
  <line x1="30" y1="200" x2="170" y2="200" stroke="url(#indigo)" stroke-width="0.5" opacity="0.3"/>
  <line x1="230" y1="200" x2="370" y2="200" stroke="url(#indigo)" stroke-width="0.5" opacity="0.3"/>
  <line x1="200" y1="30" x2="200" y2="170" stroke="url(#indigo)" stroke-width="0.5" opacity="0.3"/>
  <line x1="200" y1="230" x2="200" y2="370" stroke="url(#indigo)" stroke-width="0.5" opacity="0.3"/>
</svg>
